<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChatGPT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ChatGPT</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f7f7f8;--surface:#ffffff;--fg:#0d0d0d;--fg2:#5d5d5d;--mute:#8e8e93;
  --line:#ebebeb;--card:#f4f4f4;--pill:#f2f2f2;--user-bg:#f4f4f4;--user-fg:#0d0d0d;
  --black:#0d0d0d;--black-fg:#ffffff;--blue:#007aff;--blue-bg:#eaf3ff;
  --bad:#d93025;--bad-bg:#fff1f0;--bad-line:#ffccc7;--ok:#16a34a;
  --glass:rgba(255,255,255,.82);--glass-line:rgba(0,0,0,.07);
  --shadow:0 4px 20px rgba(0,0,0,.08);--shadow-sm:0 2px 10px rgba(0,0,0,.06);
  --code-bg:#f7f7f8
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d0d0d;--bg2:#171717;--surface:#1c1c1e;--fg:#f5f5f5;--fg2:#b4b4b4;--mute:#8e8e93;
  --line:#2a2a2c;--card:#212121;--pill:#262628;--user-bg:#2a2a2d;--user-fg:#f5f5f5;
  --black:#f5f5f5;--black-fg:#0d0d0d;--blue:#4da3ff;--blue-bg:#162944;
  --bad:#ff6b6b;--bad-bg:#2c1616;--bad-line:#5c2626;--ok:#4ade80;
  --glass:rgba(28,28,30,.82);--glass-line:rgba(255,255,255,.1);
  --shadow:0 6px 24px rgba(0,0,0,.45);--shadow-sm:0 2px 12px rgba(0,0,0,.35);
  --code-bg:#171717
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation}
body{
  background:var(--bg);color:var(--fg);
  font:15.5px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}

/* 顶部导航（严格仿 ChatGPT iOS 毛玻璃胶囊风格） */
header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 14px 10px;background:var(--bg);flex:none;z-index:5
}
.g-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--glass);border:1px solid var(--glass-line);
  box-shadow:var(--shadow-sm);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:none;
  transition:transform .12s,opacity .12s
}
.g-btn:active{transform:scale(.94);opacity:.8}
.g-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 顶部居中「聊天 / 工作」分段胶囊 + 模型切换 */
.top-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg{
  display:inline-flex;align-items:center;padding:3px;border-radius:22px;
  background:var(--glass);border:1px solid var(--glass-line);
  box-shadow:var(--shadow-sm);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.seg button{
  padding:6px 16px;border-radius:18px;font-size:14.5px;font-weight:500;color:var(--fg2);
  transition:background .15s,color .15s
}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600}
.model-sub{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:var(--mute);padding:2px 8px;border-radius:10px;max-width:190px
}
.model-sub:active{background:var(--card)}
.model-sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.top-right{
  display:inline-flex;align-items:center;height:42px;padding:0 4px;border-radius:21px;
  background:var(--glass);border:1px solid var(--glass-line);
  box-shadow:var(--shadow-sm);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  flex:none
}
.top-right button{
  width:36px;height:36px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg)
}
.top-right button:active{background:var(--card)}
.top-right svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 聊天内容区 */
#list{
  flex:1;overflow-y:auto;padding:12px 16px 24px;
  -webkit-overflow-scrolling:touch
}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:12px;padding-bottom:10vh
}
.empty h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.3px;color:var(--fg)}
.empty p{margin:0;font-size:14px;color:var(--mute);max-width:270px}
.empty-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px;max-width:320px}
.ep{
  padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg2);font-size:13.5px;font-weight:500
}
.ep:active{background:var(--card)}

/* 用户消息（ChatGPT 浅灰右对齐胶囊） */
.u-wrap{display:flex;justify-content:flex-end;margin:0 0 20px}
.u{
  max-width:82%;background:var(--user-bg);color:var(--user-fg);
  padding:10px 16px;border-radius:22px;
  white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.55
}
.u img{display:block;max-width:62vw;max-height:220px;border-radius:14px;margin-bottom:6px}
.fc{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--bg);border:1px solid var(--line);
  padding:4px 10px;border-radius:10px;font-size:13px;color:var(--fg2);margin:0 4px 6px 0
}

/* AI 回复（ChatGPT 无头像纯文字排版） */
.a{margin:0 0 24px;max-width:100%}

/* 思考折叠条（默认折叠，流式原地更新，展开后上下丝滑滑动） */
.th{margin:0 0 10px}
.th-btn{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--fg2);padding:4px 0;font-size:14px;font-weight:500
}
.th-btn:active{opacity:.65}
.th-dot{width:7px;height:7px;border-radius:50%;background:var(--fg);flex:none;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.th-arr{font-size:12px;color:var(--mute);transition:transform .15s}
.th-btn.open .th-arr{transform:rotate(90deg)}
.tk{
  margin:6px 0 8px;padding:10px 12px;
  background:var(--bg2);border-left:2px solid var(--line);border-radius:0 10px 10px 0;
  color:var(--fg2);font-size:13.5px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
  max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain
}

/* 正文 Markdown */
.t{word-break:break-word;font-size:15.5px;line-height:1.72;color:var(--fg)}
.t p{margin:0 0 11px}.t p:last-child{margin-bottom:0}
.t h1,.t h2,.t h3,.t h4{margin:16px 0 6px;font-weight:600;line-height:1.35}
.t h1{font-size:19px}.t h2{font-size:17px}.t h3{font-size:16px}
.t ul,.t ol{margin:6px 0 11px;padding-left:20px}.t li{margin:4px 0}
.t blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--line);color:var(--fg2)}
.t code{font:13.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code-bg);padding:1.5px 5px;border-radius:5px}

/* 代码 / 文件折叠卡片（跟思考一样默认折叠，带直接保存为文件按钮） */
.file-card{
  margin:10px 0;border:1px solid var(--line);border-radius:16px;
  background:var(--bg2);overflow:hidden
}
.file-head{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  cursor:pointer
}
.file-ico{
  width:34px;height:34px;border-radius:10px;background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--fg);flex:none
}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:12px;color:var(--mute);margin-top:1px}
.file-arr{font-size:12px;color:var(--mute);transition:transform .15s;padding:0 4px}
.file-card.open .file-arr{transform:rotate(90deg)}
.file-bar{
  display:flex;align-items:center;gap:6px;padding:0 12px 10px;flex-wrap:wrap
}
.fbtn{
  padding:5px 11px;border-radius:10px;font-size:12.5px;font-weight:500;
  background:var(--bg);border:1px solid var(--line);color:var(--fg)
}
.fbtn.pri{background:var(--black);color:var(--black-fg);border-color:var(--black)}
.fbtn:active{opacity:.75}
.file-src{display:none;border-top:1px solid var(--line);background:var(--code-bg)}
.file-card.open .file-src{display:block}
.file-src pre{
  margin:0;padding:10px 12px;overflow:auto;font-size:12.5px;line-height:1.55;
  max-height:44vh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain
}
.file-src pre code{padding:0;background:none;font-size:12.5px}

.typing{display:inline-flex;gap:4px;padding:6px 2px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:pulse 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}

.err-box{margin-top:6px;padding:10px 13px;border-radius:14px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-size:13.5px;line-height:1.5}
.cut{color:var(--bad);font-size:12.5px;margin-top:6px}

/* 消息底部极简操作行 */
.acts{display:flex;align-items:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12.5px;color:var(--mute)}
.act:active{background:var(--card);color:var(--fg)}
.det{margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px}
.det div{display:flex;justify-content:space-between;gap:14px;padding:2.5px 0}
.det span:first-child{color:var(--mute);flex:none}
.det span:last-child{text-align:right;word-break:break-all;color:var(--fg2)}
.ok{color:var(--ok)!important}.diff{color:var(--bad)!important}

/* 底部输入栏（严格仿 ChatGPT iOS 底部胶囊） */
.composer-wrap{flex:none;padding:6px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
#atts{display:none;gap:8px;padding:0 2px 8px;overflow-x:auto}
.ch{position:relative;flex:none}
.ch img{width:54px;height:54px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}
.ch span{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
.ch button{position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:10px;background:var(--black);color:var(--black-fg);font-size:10px;display:flex;align-items:center;justify-content:center}
.composer-row{display:flex;align-items:flex-end;gap:8px}
.plus-fab{
  width:42px;height:42px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);font-size:22px;flex:none
}
.plus-fab:active{transform:scale(.94)}
.composer{
  flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:24px;
  padding:6px 6px 6px 14px;display:flex;align-items:flex-end;gap:6px
}
#ta{
  flex:1;min-width:0;resize:none;max-height:132px;border:0;background:transparent;color:var(--fg);
  padding:6px 0;font-family:inherit;font-size:16px;line-height:1.4;outline:none
}
#ta::placeholder{color:var(--mute)}
#send{
  width:34px;height:34px;border-radius:50%;
  background:var(--black);color:var(--black-fg);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;flex:none
}
#send:active{transform:scale(.94)}

/* 左侧抽屉（严格照搬 IMG_1852.png ChatGPT 侧边栏！） */
.drawer-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;
  opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(2px)
}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:82%;max-width:330px;
  background:var(--bg);z-index:21;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .24s cubic-bezier(.22,1,.36,1);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:6px 0 28px rgba(0,0,0,.14)
}
.drawer.on{transform:translateX(0)}
.d-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.d-brand{font-size:21px;font-weight:700;letter-spacing:-.4px}
.d-search-wrap{padding:0 16px 8px;display:none}
.d-search-wrap.on{display:block}
.d-search-wrap input{width:100%;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14.5px;outline:none}
.d-nav{padding:4px 10px 8px}
.d-item{
  width:100%;display:flex;align-items:center;gap:13px;
  padding:11px 12px;border-radius:14px;font-size:15.5px;font-weight:500;color:var(--fg);text-align:left
}
.d-item:active,.d-item.on{background:var(--card)}
.d-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;color:var(--fg);flex:none}
.d-item .badge{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}
.d-sec{padding:14px 20px 6px;font-size:13px;font-weight:600;color:var(--fg)}
.d-hr{height:1px;background:var(--line);margin:8px 18px}
.d-list{flex:1;overflow-y:auto;padding:0 10px 14px;-webkit-overflow-scrolling:touch}
.cv{display:flex;align-items:center;gap:2px;margin-bottom:2px}
.cv .opt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 12px;border-radius:12px;font-size:15px;color:var(--fg)}
.cv .opt.on{background:var(--card);font-weight:600}
.cv .opt.on::after{content:none}
.cv .more-cv{color:var(--mute);padding:6px 8px;font-size:16px;border-radius:8px;flex:none}
.cv .more-cv:active{background:var(--card);color:var(--fg)}
/* 侧边栏底部：黑色「聊天」胶囊 + 右侧蓝紫圆头像（完全仿 IMG_1852.png） */
.d-foot{
  padding:10px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg)
}
.new-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--black);color:var(--black-fg);
  padding:11px 22px;border-radius:26px;font-size:15.5px;font-weight:600;
  box-shadow:var(--shadow-sm)
}
.new-pill:active{opacity:.82}
.new-pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.u-av-btn{
  width:44px;height:44px;border-radius:50%;
  background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;padding:4px
}
.u-av-in{
  width:100%;height:100%;border-radius:50%;background:#6b7cff;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px
}

/* 浮动模型菜单（仿 IMG_1850.png 居中毛玻璃卡片） */
.pop-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:25;
  display:none;align-items:flex-start;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 60px) 20px 20px;backdrop-filter:blur(2px)
}
.pop-mask.on{display:flex}
.pop-card{
  width:250px;max-height:66vh;overflow-y:auto;
  background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border:1px solid var(--glass-line);border-radius:24px;padding:10px 8px;
  box-shadow:0 12px 40px rgba(0,0,0,.18)
}
.pop-grp{padding:8px 14px 4px;font-size:12px;color:var(--mute);font-weight:600}
.pop-hr{height:1px;background:var(--line);margin:6px 12px}
.pop-opt{
  width:100%;display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-radius:14px;font-size:15px;text-align:left;color:var(--fg)
}
.pop-opt:active{background:var(--card)}
.pop-opt .ck{width:16px;font-weight:700;color:var(--fg);flex:none}
.pop-opt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 底部抽屉 & 全屏设置页（完全仿 IMG_1853.png & IMG_1854.png） */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;z-index:26;backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.panel{background:var(--bg2);width:100%;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.panel-bar{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:600}

.full-modal{
  position:fixed;inset:0;background:var(--bg2);z-index:28;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)
}
.full-modal.on{display:flex}
.fm-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.fm-title{font-size:17px;font-weight:600}
.fm-body{flex:1;overflow-y:auto;padding:8px 16px 28px;-webkit-overflow-scrolling:touch}

/* ChatGPT 设置分组白色大圆角卡片 */
.set-group{background:var(--surface);border-radius:22px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.set-row{
  width:100%;display:flex;align-items:center;gap:13px;padding:14px 16px;text-align:left;
  border-bottom:1px solid var(--line)
}
.set-row:last-child{border-bottom:0}
.set-row:active{background:var(--card)}
.set-row svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;color:var(--fg);flex:none}
.set-row .sr-t{font-size:15.5px;font-weight:500;color:var(--fg)}
.set-row .sr-d{font-size:12.5px;color:var(--mute);margin-top:2px}
.set-row .sr-v{margin-left:auto;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card label{display:block;font-size:12.5px;color:var(--fg2);margin:10px 0 4px;font-weight:500}
.card label:first-child{margin-top:0}
.card input,.card select,.card textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:10px 12px;font-size:15.5px;outline:none}
.card textarea{min-height:84px;font-size:14.5px;line-height:1.5}
.card textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.sw-row .sw-t{font-size:15px;font-weight:500}.sw-row .sw-d{font-size:12.5px;color:var(--mute);margin-top:2px}
.sw{position:relative;width:48px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:background .2s}
.sw.on{background:var(--black)}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:23px;height:23px;border-radius:50%;background:var(--bg);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.sw.on::after{transform:translateX(20px)}

<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
const BASE={openai:'https://api.openai.com/v1',deepseek:'https://api.deepseek.com/v1',anthropic:'https://api.anthropic.com',gemini:'https://generativelanguage.googleapis.com'};
const TYPES={openai:'OpenAI 兼容（大多数服务商）',deepseek:'DeepSeek',anthropic:'Anthropic Claude',gemini:'Google Gemini'};
const DEFAULT_MODELS={deepseek:['deepseek-chat','deepseek-reasoner']};
const EXT_MAP={html:'html',htm:'html',css:'css',js:'js',javascript:'js',ts:'ts',typescript:'ts',py:'py',python:'py',json:'json',md:'md',markdown:'md',sh:'sh',bash:'sh',sql:'sql',xml:'xml',yaml:'yml',yml:'yml',java:'java',c:'c',cpp:'cpp',go:'go',rs:'rs',rust:'rs',txt:'txt',csv:'csv'};

let channels=ls.get('ch',[]),sel=ls.get('sel',null),busy=false,convs=ls.get('convs',null),cid=ls.get('cid',null),msgs=[];
/* 默认关闭全局跨对话记忆（memOn:false），确保每个对话框严格独立记忆、新对话绝不串台 */
let cfg=Object.assign({ctxOn:true,ctxTurns:30,memOn:false,autoExpandThink:false,autoExpandCode:false,mode:'chat',nick:'',style:'',sys:''},ls.get('cfg',{}));
let mems=ls.get('mems',[]);

const packConvs=(keepAttText=true,maxMsgs=60)=>convs.map(c=>({id:c.id,title:c.title,ts:c.ts,pinned:!!c.pinned,note:c.note||'',msgs:c.msgs.slice(-maxMsgs).map(m=>{const{streaming,t0,thinkStart,...r}=m;if(r.atts)r.atts=r.atts.map(a=>keepAttText?{kind:a.kind,name:a.name,text:a.text}:{kind:a.kind,name:a.name});return r})}));
const save=()=>{
  ls.set('ch',channels);ls.set('sel',sel);ls.set('cid',cid);ls.set('cfg',cfg);ls.set('mems',mems);
  if(ls.set('convs',packConvs(true,60)))return;
  if(ls.set('convs',packConvs(false,60))){toast('本地空间不足，已省略历史文本附件');return}
  if(ls.set('convs',packConvs(false,20))){toast('本地空间不足，已精简旧对话缓存');return}
  toast('本地存储已满，建议删除部分旧对话')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const newConv=()=>({id:uid(),title:'新对话',msgs:[],ts:Date.now(),pinned:false,note:''});
if(!convs){convs=[];const old=ls.get('msgs',[]);if(old.length){const c=newConv();c.msgs=old;c.title=(old.find(m=>m.role==='user')?.text||'之前的对话').slice(0,24);convs.push(c)}}
convs.forEach(c=>{if(c.pinned==null)c.pinned=false;c.msgs.forEach(m=>{delete m.streaming;delete m.t0;delete m.thinkStart;if(typeof m.text!=='string')m.text='';if(m.role==='assistant'&&!m.text&&!m.think){m.err=true;m.text='上次生成未完成'}})});
{let c=convs.find(c=>c.id===cid)||convs[0];if(!c){c=newConv();convs.push(c)}cid=c.id;msgs=c.msgs}
const curConv=()=>convs.find(c=>c.id===cid)||convs[0];
const cur=()=>{const c=channels.find(c=>c.id===sel?.ch);return c&&sel.m?{c,m:sel.m}:null};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2300)}

/* ---- 文件下载与统计 ---- */
function downloadFile(name,content,mime='text/plain;charset=utf-8'){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('已保存文件：'+name)}
const fmtSize=s=>{const b=new Blob([s]).size;return b<1024?(b+' B'):((b/1024).toFixed(1)+' KB')};

/* ---- Markdown 渲染：所有代码块/文件均像思考一样默认折叠，带直接「保存文件」按钮 ---- */
let codeStore=[];
const openCodeKeys=new Set();
function inlineMd(s){
  return s.split(/(`[^`\n]+`)/g).map((q,j)=>j%2
    ?'<code>'+esc(q.slice(1,-1))+'</code>'
    :esc(q).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
  ).join('')}
function md(s,isStreaming=false,msgKey=''){
  const parts=String(s).split(/(```[^\n]*\n?[\s\S]*?(?:```|$))/g);
  return parts.map((p,i)=>{
    if(i%2){
      const closed=/```$/.test(p);
      const m=p.match(/^```([^\n]*)\n?([\s\S]*?)(?:```)?$/);
      const info=(m?.[1]||'').trim(),code=(m?.[2]||'').replace(/\n$/,'');
      let lang=info,fname='';
      if(info.includes(':')){const sp=info.split(':');lang=sp[0].trim();fname=sp.slice(1).join(':').trim()}
      else if(info.includes('.')){fname=info;lang=info.split('.').pop().toLowerCase()}
      const ext=EXT_MAP[lang.toLowerCase()]||'txt';
      const isHtml=ext==='html'||/^\s*<!doctype\s+html/i.test(code)||/^\s*<html/i.test(code);
      if(!fname)fname=isHtml?'index.html':('code.'+ext);
      const lineCount=code?code.split('\n').length:0;
      const key=msgKey+':'+i;
      const isOpen=cfg.autoExpandCode||openCodeKeys.has(key);
      const idx=codeStore.push({code,fname,isHtml,key})-1;
      const tag=(ext||'FILE').toUpperCase().slice(0,4);
      const meta=isStreaming&&!closed?('正在编写… '+fmtSize(code)):(fmtSize(code)+' · '+lineCount+' 行');
      return'<div class="file-card'+(isOpen?' open':'')+'" data-ckey="'+esc(key)+'">'+
        '<div class="file-head" data-ftog="'+idx+'">'+
          '<div class="file-ico">'+esc(tag)+'</div>'+
          '<div class="file-info"><div class="file-name">'+esc(fname)+'</div><div class="file-meta">'+esc(meta)+'</div></div>'+
          '<span class="file-arr">▸</span>'+
        '</div>'+
        '<div class="file-bar">'+
          '<button class="fbtn pri" data-dl="'+idx+'">保存文件</button>'+
          (isHtml?'<button class="fbtn" data-prev="'+idx+'">预览</button>':'')+
          '<button class="fbtn" data-code="'+idx+'">复制</button>'+
          '<button class="fbtn" data-ftog="'+idx+'">'+(isOpen?'收起代码':'展开代码')+'</button>'+
        '</div>'+
        '<div class="file-src"><pre><code>'+(isOpen?esc(code):'')+'</code></pre></div>'+
      '</div>';
    }
    const lines=p.split('\n');let out='',inUl=false,inOl=false;
    const closeLists=()=>{if(inUl){out+='</ul>';inUl=false}if(inOl){out+='</ol>';inOl=false}};
    for(const raw of lines){
      const h=raw.match(/^(#{1,4})\s+(.+)$/);
      if(h){closeLists();out+='<h'+h[1].length+'>'+inlineMd(h[2])+'</h'+h[1].length+'>';continue}
      const ul=raw.match(/^\s*[-*•]\s+(.+)$/);
      if(ul){if(inOl){out+='</ol>';inOl=false}if(!inUl){out+='<ul>';inUl=true}out+='<li>'+inlineMd(ul[1])+'</li>';continue}
      const ol=raw.match(/^\s*\d+\.\s+(.+)$/);
      if(ol){if(inUl){out+='</ul>';inUl=false}if(!inOl){out+='<ol>';inOl=true}out+='<li>'+inlineMd(ol[1])+'</li>';continue}
      const bq=raw.match(/^>\s?(.*)$/);
      if(bq){closeLists();out+='<blockquote>'+inlineMd(bq[1])+'</blockquote>';continue}
      closeLists();
      if(raw.trim())out+='<p>'+inlineMd(raw)+'</p>';
    }
    closeLists();
    return out;
  }).join('')}

/* ---- 系统提示词：严格隔离对话记忆，默认不串台 ---- */
function buildSystemPrompt(conv){
  const parts=[];
  if(cfg.mode==='work')parts.push('当前处于工作/Codex 编程模式。需要输出完整文件或代码时，请使用带文件名的代码块（如 ```html:index.html ），客户端会自动折叠成可一键保存的文件卡片。');
  else parts.push('当用户要求生成文件或代码时，请直接用带文件名的代码块输出完整内容（如 ```html:index.html ），客户端会自动提供一键保存文件按钮。');
  if(cfg.nick)parts.push('用户希望你称呼他/她为：'+cfg.nick);
  if(cfg.style)parts.push('回答风格偏好：'+cfg.style);
  if(cfg.sys)parts.push(cfg.sys);
  if(conv?.note)parts.push('当前对话专属背景/记忆：\n'+conv.note);
  if(cfg.memOn&&mems.length)parts.push('跨对话全局记忆：\n'+mems.map((x,i)=>(i+1)+'. '+x).join('\n'));
  return parts.join('\n\n')}

/* ---- 附件 ---- */
let att=[],ctl=null;
const attHtml=m=>(m.atts||[]).map(a=>{
  if(a.kind==='image'&&a.data)return'<img src="'+a.data+'">';
  const expired=(a.kind==='image'||a.kind==='pdf')&&!a.data;
  return'<div class="fc">'+(a.kind==='image'?'🖼 ':'📄 ')+esc(a.name)+(expired?'（已释放）':'')+'</div>'}).join('');
function drawAtts(){const A=$('#atts');A.style.display=att.length?'flex':'none';A.innerHTML=att.map((a,i)=>'<div class="ch">'+(a.kind==='image'?'<img src="'+a.data+'">':'<span>📄 '+esc(a.name)+'</span>')+'<button data-r="'+i+'">✕</button></div>').join('')}
$('#atts').onclick=e=>{const b=e.target.closest('[data-r]');if(b){att.splice(+b.dataset.r,1);drawAtts()}};
const toURL=(f,mt)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.replace(/^data:[^;,]*/,'data:'+mt));r.onerror=()=>no(new Error('文件读取失败'));r.readAsDataURL(f)});
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const w=i.naturalWidth||i.width,h=i.naturalHeight||i.height;if(!w||!h){URL.revokeObjectURL(u);no(new Error('尺寸无效'));return}const k=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85))};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('解码失败'))};i.src=u})}
async function readFile(f){
  if(f.size===0)throw new Error(f.name+' 是空文件');
  if(f.size>20e6)throw new Error(f.name+' 太大（上限约 20MB）');
  if(f.type.startsWith('image/')||/\.(png|jpe?g|webp|gif|bmp|heic|heif)$/i.test(f.name)){
    try{return{kind:'image',name:f.name,data:await shrink(f)}}
    catch{return{kind:'image',name:f.name,data:await toURL(f,f.type||'image/jpeg')}}}
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))return{kind:'pdf',name:f.name,data:await toURL(f,'application/pdf')};
  if(f.type.startsWith('text/')||f.type==='application/json'||/\.(txt|md|csv|json|js|ts|py|html|css|xml|log|ya?ml|java|c|cpp|go|rs|sh|sql|ini|toml)$/i.test(f.name))return{kind:'text',name:f.name,text:(await f.text()).slice(0,100000)};
  throw new Error('暂不支持这种文件：'+f.name)}
async function handleFiles(e){for(const f of e.target.files){try{att.push(await readFile(f))}catch(err){toast(err.message)}}e.target.value='';drawAtts()}
$('#fileImg').onchange=handleFiles;
$('#fileCam').onchange=handleFiles;
$('#fileDoc').onchange=handleFiles;

function body(m,t){
  const all=m.atts||[],a=all.filter(x=>x.data||x.text!=null),bin=a.filter(x=>x.kind==='image'||x.kind==='pdf');
  const gone=all.filter(x=>(x.kind==='image'||x.kind==='pdf')&&!x.data);
  let txt=(m.text||'')+a.filter(x=>x.kind==='text').map(x=>'\n\n【文件：'+x.name+'】\n'+x.text).join('');
  if(gone.length&&!txt.trim()&&!bin.length)txt='（用户之前发送了附件：'+gone.map(x=>x.name).join('、')+'，页面刷新后原文件未保留）';
  if(!bin.length)return t==='gemini'?[{text:txt}]:txt;
  txt=txt.trim()||'请看附件。';
  const b64=x=>x.data.split(',')[1]||'',mt=x=>{const idx=x.data.indexOf(';');return idx>5?x.data.slice(5,idx):'image/jpeg'};
  if(t==='anthropic')return[...bin.map(x=>x.kind==='image'?{type:'image',source:{type:'base64',media_type:mt(x),data:b64(x)}}:{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64(x)}}),{type:'text',text:txt}];
  if(t==='gemini')return[...bin.map(x=>({inlineData:{mimeType:mt(x),data:b64(x)}})),{text:txt}];

function clean(src){
  let out=[];
  for(let i=0;i<src.length;i++){
    const m=src[i];
    if(m.streaming)continue;
    if(m.role==='assistant'&&m.err)continue;
    const txt=typeof m.text==='string'?m.text:'';
    if(!txt.trim()&&!(m.atts||[]).length)continue;
    const l=out[out.length-1];
    if(l&&l.role===m.role){
      if(m.role==='user'&&l.text.trim()&&l.text.trim()===txt.trim()&&!(m.atts&&m.atts.length))continue;
      l.text=(l.text&&txt?l.text+'\n\n':l.text)+txt;
      l.atts=[...(l.atts||[]),...(m.atts||[])]}
    else out.push({role:m.role,text:txt,atts:m.atts?[...m.atts]:undefined})}
  while(out.length&&out[0].role!=='user')out.shift();
  if(!cfg.ctxOn){const lastU=[...out].reverse().find(x=>x.role==='user');return lastU?[lastU]:[]}
  const maxMsgs=(cfg.ctxTurns||30)*2+1;
  if(out.length>maxMsgs){out=out.slice(-maxMsgs);while(out.length&&out[0].role!=='user')out.shift()}
  return out}

/* ---- 协议适配 ---- */
const root=(b,t)=>{b=b.trim().replace(/\/+$/,'');return(t==='anthropic'||t==='gemini')?b.replace(/\/v1(beta)?$/,''):b};
const oaiBase=b=>{b=b.trim().replace(/\/+$/,'');try{const u=new URL(b);return u.pathname==='/'||u.pathname===''?b+'/v1':b}catch{return b}};
const errText=(j,raw)=>{const e=j&&(j.error?.message||j.error||j.message);return typeof e==='string'?e:raw.slice(0,200)};
function friendlyErr(e){
  const msg=String(e?.message||e||'未知错误');
  if(/load failed|failed to fetch|networkerror|network connection was lost|the internet connection appears to be offline/i.test(msg))
    return'网络连接中断（接口响应超时、文件过大，或手机切到了后台）';
  return msg}
async function http(url,opt){
  let r;try{r=await fetch(url,opt)}catch(e){throw new Error('网络请求失败：请检查接口地址、网络，或确认该服务支持浏览器直连')}
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch{}
  if(!r.ok)throw new Error('HTTP '+r.status+'：'+errText(j,txt));
  if(!j)throw new Error('返回内容不是 JSON：'+txt.slice(0,120));
  return j}
async function sse(url,opt,onEv){
  let r;try{r=await fetch(url,opt)}catch(e){if(e.name==='AbortError')throw e;throw new Error(friendlyErr(e))}
  if(!r.ok){const t=await r.text();let j;try{j=JSON.parse(t)}catch{}throw new Error('HTTP '+r.status+'：'+errText(j,t))}
  const eat=l=>{l=l.replace(/\r$/,'');if(!l.startsWith('data:'))return;const d=l.slice(5).trim();if(!d||d==='[DONE]')return;let j;try{j=JSON.parse(d)}catch{return}onEv(j)};
  if(!(r.headers.get('content-type')||'').includes('event-stream')){
    const t=await r.text();if(/^\s*(event:|data:)/m.test(t)){t.split('\n').forEach(eat);return}
    let j;try{j=JSON.parse(t)}catch{throw new Error('返回内容不是 JSON：'+t.slice(0,120))}
    if(Array.isArray(j))j.forEach(onEv);else onEv(j);return}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  try{
    for(;;){
      let res;try{res=await rd.read()}catch(e){if(e.name==='AbortError')throw e;throw new Error(friendlyErr(e))}
      if(res.done)break;
      buf+=dec.decode(res.value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){eat(buf.slice(0,i));buf=buf.slice(i+1)}
    }
    buf+=dec.decode();if(buf)buf.split('\n').forEach(eat)
  }finally{rd.cancel().catch(()=>{})}}
async function call(ch,model,hist,conv,on){
  const t0=performance.now(),t=ch.type,H={'content-type':'application/json'};let text='',think='',rm='',u={},cut=false,url,reqBody;
  const sysPrompt=buildSystemPrompt(conv);
  if(t==='anthropic'){
    url=root(ch.base,'anthropic')+'/v1/messages';
    Object.assign(H,{'x-api-key':ch.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'});
    reqBody={model,max_tokens:8192,stream:true,messages:hist.map(m=>({role:m.role,content:body(m,'anthropic')}))};
    if(sysPrompt)reqBody.system=sysPrompt;
  }else if(t==='gemini'){
    url=root(ch.base,'gemini')+'/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse';
    H['x-goog-api-key']=ch.key;
    reqBody={contents:hist.map(m=>({role:m.role==='user'?'user':'model',parts:body(m,'gemini')}))};
    if(sysPrompt)reqBody.systemInstruction={parts:[{text:sysPrompt}]};
  }else{
    url=oaiBase(ch.base)+'/chat/completions';
    if(ch.key)H.authorization='Bearer '+ch.key;
    const ms=hist.map(m=>({role:m.role,content:body(m,'openai')}));
    if(sysPrompt)ms.unshift({role:'system',content:sysPrompt});
    reqBody={model,stream:true,stream_options:{include_usage:true},messages:ms};
  }
  await sse(url,{method:'POST',headers:H,signal:ctl.signal,body:JSON.stringify(reqBody)},j=>{
    if(j.error)throw new Error(typeof j.error==='string'?j.error:String(j.error.message||JSON.stringify(j.error)).slice(0,200));
    if(t==='anthropic'){
      if(j.type==='message_start'){rm=j.message?.model||rm;u.i=j.message?.usage?.input_tokens}
      else if(j.type==='content_block_delta'){const d=j.delta||{};if(d.type==='text_delta'&&d.text)text+=d.text;else if(d.type==='thinking_delta'&&d.thinking)think+=d.thinking}
      else if(j.type==='message_delta'){if(j.usage?.output_tokens!=null)u.o=j.usage.output_tokens;if(j.delta?.stop_reason==='max_tokens')cut=true}
      else if(j.type==='message'){rm=j.model||rm;u={i:j.usage?.input_tokens,o:j.usage?.output_tokens};if(j.stop_reason==='max_tokens')cut=true;for(const b of j.content||[]){if(b.type==='text'&&b.text)text+=b.text;else if(b.type==='thinking'&&b.thinking)think+=b.thinking}}
    }else if(t==='gemini'){
      const cand=j.candidates?.[0];
      for(const p of cand?.content?.parts||[]){if(p.thought)think+=p.text||'';else text+=p.text||''}
      if(cand?.finishReason==='MAX_TOKENS')cut=true;
      rm=j.modelVersion||rm;if(j.usageMetadata)u={i:j.usageMetadata.promptTokenCount,o:j.usageMetadata.candidatesTokenCount}
    }else{
      const c=j.choices?.[0],d=c?.delta||c?.message||{};
      text+=typeof d.content==='string'?d.content:(d.content||[]).map(p=>p.text||'').join('');
      const rk=d.reasoning_content||d.reasoning;if(typeof rk==='string')think+=rk;
      if(c?.finish_reason==='length')cut=true;
      rm=j.model||rm;if(j.usage)u={i:j.usage.prompt_tokens,o:j.usage.completion_tokens}
    }
    on(text,think)});
  if(!text)throw new Error('模型没有返回文字内容');
  return{text,think,rm:rm||'（接口未返回）',u,cut,ms:Math.round(performance.now()-t0)}}
async function listModels(ch){
  if(ch.type==='anthropic'){const j=await http(root(ch.base,'anthropic')+'/v1/models?limit=100',{headers:{'x-api-key':ch.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});return list(j.data||j.models).map(x=>x.id||x.name).filter(Boolean)}
  if(ch.type==='gemini'){const j=await http(root(ch.base,'gemini')+'/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':ch.key}});return list(j.models).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace(/^models\//,'')).filter(Boolean)}
  const h=ch.key?{authorization:'Bearer '+ch.key}:{};

function same(a,b){a=a.toLowerCase().replace(/^models\//,'');b=b.toLowerCase().replace(/^models\//,'');if(a===b)return true;const[x,y]=a.length<b.length?[a,b]:[b,a];return y.startsWith(x+'-')&&/^(\d{4}-\d{2}-\d{2}|\d{8}|\d{4}|\d{3}|latest|preview.*)$/.test(y.slice(x.length+1))}

async function runAssist(hist,s,targetConv){
  busy=true;$('#send').textContent='■';ctl=new AbortController();
  const m={role:'assistant',text:'',think:'',streaming:true,t0:Date.now()};
  targetConv.msgs.push(m);save();render(true);
  try{
    const r=await call(s.c,s.m,hist,targetConv,(t,k)=>{
      if(k&&!t&&!m.thinkStart)m.thinkStart=Date.now();
      if(t&&m.thinkStart&&!m.thinkSec)m.thinkSec=Math.max(1,Math.round((Date.now()-m.thinkStart)/1000));
      m.text=t;m.think=k;soft();
    });
    if(m.thinkStart&&!m.thinkSec)m.thinkSec=Math.max(1,Math.round((Date.now()-m.thinkStart)/1000));
    delete m.t0;delete m.thinkStart;
    Object.assign(m,{text:r.text,think:r.think,streaming:false,meta:{req:s.m,rm:r.rm,ch:s.c.name,type:s.c.type,ms:r.ms,u:r.u,cut:r.cut}})
  }catch(e){
    delete m.t0;delete m.thinkStart;m.streaming=false;
    if(e.name==='AbortError'){if(!m.text){m.err=true;m.text='已停止生成'}}
    else{if(m.text)m.partial=m.text;m.err=true;m.text=friendlyErr(e)}
  }
  if(softTimer){clearTimeout(softTimer);softTimer=0}
  busy=false;$('#send').textContent='↑';save();render()
}

async function retryAt(idx){

  const cv=curConv();cv.msgs.splice(idx,1);
  const hist=clean(cv.msgs);
  if(!hist.length){toast('没有可重试的消息');render();return}
  await runAssist(hist,s,cv);
}

  const ta=$('#ta'),text=ta.value.trim();if((!text&&!att.length)||busy)return;

  att=[];drawAtts();ta.value='';ta.style.height='auto';
  const hist=clean(cv.msgs);
  await runAssist(hist,s,cv);
}

/* ---- 左侧抽屉（带置顶分区、搜索、资料库） ---- */
function collectLibrary(){
  const items=[];
  for(const c of convs){
    for(const m of c.msgs){
      if(m.role!=='assistant'||!m.text)continue;
      const parts=m.text.split(/(```[^\n]*\n?[\s\S]*?(?:```|$))/g);
      for(let i=1;i<parts.length;i+=2){
        const mm=parts[i].match(/^```([^\n]*)\n?([\s\S]*?)(?:```)?$/);
        const info=(mm?.[1]||'').trim(),code=(mm?.[2]||'').replace(/\n$/,'');
        if(!code.trim())continue;
        let lang=info,fname='';
        if(info.includes(':')){const sp=info.split(':');lang=sp[0].trim();fname=sp.slice(1).join(':').trim()}
        else if(info.includes('.')){fname=info;lang=info.split('.').pop().toLowerCase()}
        const ext=EXT_MAP[lang.toLowerCase()]||'txt';
        const isHtml=ext==='html'||/^\s*<!doctype\s+html/i.test(code)||/^\s*<html/i.test(code);
        if(!fname)fname=isHtml?'index.html':('code.'+ext);
        items.push({fname,code,isHtml,convTitle:c.title});
      }
    }
  }
  return items;
}
function openLibrary(){
  const items=collectLibrary();
  const P=$('#pmod');
  P.innerHTML='<div class="panel-bar"></div><h3>资料库（已生成文件）</h3>'+
    (items.length?items.map((it,i)=>'<div class="mem-item"><div><div style="font-weight:600">'+esc(it.fname)+'</div><div style="font-size:12px;color:var(--mute)">来自：'+esc(it.convTitle)+' · '+fmtSize(it.code)+'</div></div><button class="fbtn pri" data-libdl="'+i+'">保存</button></div>').join(''):'<div style="text-align:center;color:var(--mute);padding:26px 0;font-size:14px">还没有生成过代码或文件</div>');
  $('#smod').classList.add('on');
  P.querySelectorAll('[data-libdl]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.libdl];if(it)downloadFile(it.fname,it.code,it.isHtml?'text/html;charset=utf-8':'text/plain;charset=utf-8')});
}
function drawDrawer(){
  $('#duav').textContent=(cfg.nick||'我').slice(0,1);
  const libCount=collectLibrary().length;
  $('#b-lib').textContent=libCount?(libCount+''):'';
  const q=($('#qhist').value||'').trim().toLowerCase();
  const all=[...convs].filter(c=>!q||c.title.toLowerCase().includes(q));
  const pinned=all.filter(c=>c.pinned).sort((a,b)=>b.ts-a.ts);
  const normal=all.filter(c=>!c.pinned).sort((a,b)=>b.ts-a.ts);
  const row=c=>'<div class="cv"><button class="opt'+(c.id===cid?' on':'')+'" data-v="'+c.id+'">'+esc(c.title)+'</button><button class="more-cv" data-cm="'+c.id+'" aria-label="更多">⋯</button></div>';
  let html='';
  if(pinned.length){html+='<div class="d-sec">置顶</div>'+pinned.map(row).join('')+'<div class="d-hr"></div>'}
  html+=normal.length?normal.map(row).join(''):(!pinned.length?'<div style="text-align:center;color:var(--mute);padding:24px 0;font-size:13.5px">没有匹配的对话</div>':'');
  $('#dlist').innerHTML=html;
}

function openApiModal(){
  const P=$('#ps');

  $('#apiModal').classList.add('on')}
$('#apiClose').onclick=()=>{$('#apiModal').classList.remove('on');if($('#setModal').classList.contains('on'))openSettings();render()};
function syncField(el){
  const k=el.dataset.k,card=el.closest('.card');if(!k||!card)return;
  const c=channels.find(x=>x.id===card.dataset.id);if(!c)return;
  if(k==='models'){c.models=el.value.split('\n').map(s=>s.trim()).filter(Boolean);if(sel?.ch===c.id&&!c.models.includes(sel.m))sel=null}
  else if(k==='type'){
    const old=c.type;c.type=el.value;
    if(!c.base||c.base===BASE[old])c.base=BASE[c.type];
    if(!c.models.length&&DEFAULT_MODELS[c.type])c.models=[...DEFAULT_MODELS[c.type]];
    save();openApiModal();return}
  else c[k]=el.value.trim();
  save();render()}
$('#ps').oninput=e=>{if(e.target.tagName!=='SELECT')syncField(e.target)};
$('#ps').onchange=e=>syncField(e.target);
$('#ps').onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='add'){channels.push({id:uid(),name:'新接口',type:'openai',base:BASE.openai,key:'',models:[]});save();openApiModal();return}
  const c=channels.find(x=>x.id===b.closest('.card').dataset.id);if(!c)return;
  if(a==='del'){if(!confirm('删除「'+c.name+'」？'))return;channels=channels.filter(x=>x!==c);if(sel?.ch===c.id)sel=null;save();openApiModal();return}
  if(a==='fetch'){
    if(!c.key&&c.type!=='openai'){toast('先填 API Key');return}
    if(b.disabled)return;
    b.disabled=true;b.textContent='获取中…';
    try{const ms=await listModels(c);if(!channels.includes(c))return;c.models=ms;if(sel?.ch===c.id&&!c.models.includes(sel.m))sel=null;save();toast('获取到 '+ms.length+' 个模型');const t=document.querySelector('.card[data-id="'+c.id+'"] [data-k=models]');if(t)t.value=ms.join('\n');render()}catch(err){toast(err.message.slice(0,80))}
    b.disabled=false;b.textContent='获取模型列表'}};

render();if(!channels.length)setTimeout(()=>{if(!channels.length){channels.push({id:uid(),name:'我的接口',type:'openai',base:BASE.openai,key:'',models:[]});save();openApiModal()}},300);
</script>
